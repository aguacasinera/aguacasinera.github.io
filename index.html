<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Agua Casinera</title>
    <meta name="description" content="App del grupo de baile Agua Casinera: avisa si vas al ensayo.">
    <meta name="theme-color" content="#121214">

    <!-- Lo que hace que se pueda instalar -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
    <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Agua Casinera">
    <meta name="apple-mobile-web-app-status-bar-style" content="black"><!-- barra del iPhone opaca y negra: no tapa el contenido y sirve en los dos temas -->

    <link rel="preload" href="iconos/logo-blanco.png" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
    <!-- v1.22: aplica el tema (claro/oscuro) antes de pintar, para que no parpadee en blanco -->
    <script>
      try {
        var t = localStorage.getItem('ac_tema') || 'auto';
        var oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', oscuro ? 'oscuro' : 'claro');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="estilos.css">
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div class="cargando"><span class="ola"></span>Cargando…</div>
    </main>
    <noscript>Activa JavaScript para usar la app.</noscript>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
